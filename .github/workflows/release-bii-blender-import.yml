# Releases BII Blender Import as bii_blender_import-v<version>, with the version from
# plugins/bii_blender_import/blender_manifest.toml. Raise that version first, then run it on main from
# Actions > Release BII Blender Import > Run workflow. See release-extension.yml.

name: Release BII Blender Import

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-extension.yml
    with:
      extension_dir: plugins/bii_blender_import
      tag_prefix: bii_blender_import
      title: BII Blender Import
      prerelease: ${{ inputs.prerelease }}
