schema_version = "1.0.0"

id = "bii_blender_tools"
version = "0.1.0"
name = "BII Blender Tools"
tagline = "IFC cleanup tools and dProB rail asset export"
maintainer = "BII GmbH"
type = "add-on"

website = "https://github.com/BII-GmbH/blender-tools"

tags = ["Import-Export", "Mesh"]

blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Export rail assets and write the FBX export preset"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
]
